name: Deploy Worker

# Chỉ deploy khi bấm /update trên Telegram (hoặc Run workflow trên GitHub)
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài thư viện
        run: npm install --no-audit --no-fund

      - name: Tạo / tìm KV namespace
        run: node scripts/ensure-kv.mjs

      - name: Ghi phiên bản
        run: |
          node -e '
            const fs = require("fs");
            const msg = require("child_process").execSync("git log -1 --pretty=%s").toString().trim();
            const t = "\n[vars]\nVERSION = " + JSON.stringify(process.env.GITHUB_SHA.slice(0, 7)) +
              "\nVERSION_MSG = " + JSON.stringify(msg) + "\n";
            fs.appendFileSync("wrangler.toml", t);
          '
          tail -4 wrangler.toml

      - name: Deploy lên Cloudflare
        id: deploy
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Worker URL: $URL"

      - name: Đưa secrets vào Worker (nếu có)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TRMNL_MCP_KEY: ${{ secrets.TRMNL_MCP_KEY }}
        run: |
          for NAME in TELEGRAM_BOT_TOKEN TELEGRAM_OWNER_ID GH_TOKEN TRMNL_MCP_KEY; do
            VAL="${!NAME}"
            if [ -n "$VAL" ]; then
              printf '%s' "$VAL" | npx wrangler secret put "$NAME"
            fi
          done

      - name: Kết nối webhook Telegram
        if: ${{ steps.deploy.outputs.url != '' }}
        run: |
          sleep 5
          curl -s "${{ steps.deploy.outputs.url }}/setup" || true
          echo
          echo "TRMNL Polling URL: ${{ steps.deploy.outputs.url }}/trmnl"
